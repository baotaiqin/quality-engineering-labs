name: Python tests

on:
  push:
    paths:
      - "labs/**"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "labs/**"
      - ".github/workflows/python-tests.yml"

jobs:
  test-job-requirements-analysis:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/001-job-requirements-analysis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: labs/001-job-requirements-analysis/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v

  test-login-design:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/002-login-test-design
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: labs/002-login-test-design/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
